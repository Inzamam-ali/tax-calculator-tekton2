apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: tax-calculator-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: image
      value: us.icr.io/YOUR_NAMESPACE/tax-calculator:1.0.0
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: YOUR_SOURCE_WORKSPACE_PVC
