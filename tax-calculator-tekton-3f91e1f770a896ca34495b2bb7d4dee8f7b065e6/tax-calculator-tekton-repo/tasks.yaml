apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: npminstall
spec:
  description: Install Node.js project dependencies.
  workspaces:
    - name: source
  steps:
    - name: npm-install
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npm install
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jasmine
spec:
  description: Run Jasmine unit tests.
  workspaces:
    - name: source
  steps:
    - name: jasmine-tests
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npx jasmine
