<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Calculator</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <h1>Tax Calculator</h1>
    <p>Calculate estimated tax on an amount.</p>
    <label for="amount">Amount</label>
    <input id="amount" type="number" min="0" step="0.01" placeholder="Enter amount">
    <label for="rate">Tax rate (%)</label>
    <input id="rate" type="number" min="0" step="0.01" value="10">
    <button id="calculate" type="button">Calculate</button>
    <p id="result" aria-live="polite">Tax amount: $0.00</p>
  </main>
  <script src="taxCalculator.js"></script>
  <script src="script.js"></script>
</body>
</html>
